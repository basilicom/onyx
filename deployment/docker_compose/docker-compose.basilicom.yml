# =============================================================================
# Basilicom-Override für Onyx v4 (Portainer + Traefik)
# =============================================================================
# Wird ZUSÄTZLICH zur docker-compose.yml geladen (Basis bleibt unverändert).
# Setup, Env-Liste und Sicherheitsmodell: siehe README-BASILICOM.md.
#
# CLI:  docker compose -f docker-compose.yml -f docker-compose.basilicom.yml -p onyx up -d
# Host: OpenSearch braucht vm.max_map_count >= 262144.
# =============================================================================

services:
  # Portainer (Repository-Deploy) injiziert Env nur als ${VAR}-Substitution,
  # nicht als stack.env -> hier explizit mappen, sonst erreichen sie den Container nicht.
  api_server:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - WEB_DOMAIN=${WEB_DOMAIN:-}
      - USER_AUTH_SECRET=${USER_AUTH_SECRET:-}
      - ENCRYPTION_KEY_SECRET=${ENCRYPTION_KEY_SECRET:-}
      # Begrenzt die Selbst-Registrierung auf diese Domain(s) (Komma-Liste).
      - VALID_EMAIL_DOMAINS=${VALID_EMAIL_DOMAINS:-}
      # Email-Versand (optional): aktiv sobald SMTP_SERVER+SMTP_USER+SMTP_PASS
      # gesetzt sind (oder SENDGRID_API_KEY). Für Signup-Verifikation/Invites/Reset.
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - ENABLE_EMAIL_INVITES=${ENABLE_EMAIL_INVITES:-false}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
  background:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - WEB_DOMAIN=${WEB_DOMAIN:-}
      - USER_AUTH_SECRET=${USER_AUTH_SECRET:-}
      - ENCRYPTION_KEY_SECRET=${ENCRYPTION_KEY_SECRET:-}
  web_server:
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN:-}

  # Basis-Compose hat minio hinter Profil "s3-filestore"; Portainer aktiviert keine
  # Profile -> hier leeren, damit minio startet (api_server/background brauchen es).
  minio:
    profiles: !override []

  nginx:
    # Custom-Image mit eingebackenen Config-Templates (kein Host-Bind-Mount nötig;
    # Grund siehe data/nginx/Dockerfile).
    image: onyx-nginx-basilicom:${IMAGE_TAG:-latest}
    build:
      context: ../data/nginx
      dockerfile: Dockerfile
    pull_policy: build
    ports: !override []
    volumes: !override []
    environment:
      - DOMAIN=${ONYX_DOMAIN:-onyx.example.com}
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}
      # --- HTTP -> HTTPS ---
      - traefik.http.routers.onyx.entrypoints=http
      - traefik.http.routers.onyx.rule=Host(`${ONYX_DOMAIN:-onyx.example.com}`)
      - traefik.http.routers.onyx.middlewares=onyx-https-redirect
      - traefik.http.middlewares.onyx-https-redirect.redirectscheme.scheme=https
      # --- HTTPS + TLS (Zugriffsschutz: Onyx-Login, kein Netz-Filter) ---
      - traefik.http.routers.onyx-secure.entrypoints=https
      - traefik.http.routers.onyx-secure.rule=Host(`${ONYX_DOMAIN:-onyx.example.com}`)
      - traefik.http.routers.onyx-secure.tls=true
      - traefik.http.routers.onyx-secure.tls.certresolver=http
      - traefik.http.services.onyx.loadbalancer.server.port=80

  # Eingebauter Onyx-MCP-Server: Streamable-HTTP auf Port 8090, Endpoint "/".
  mcp_server:
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    command: >
      /bin/sh -c "exec python -m onyx.mcp_server_main"
    env_file:
      - path: .env
        required: false
    depends_on:
      - relational_db
      - cache
      - api_server
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - REDIS_HOST=${REDIS_HOST:-cache}
      - MCP_SERVER_ENABLED=true
      - MCP_SERVER_PORT=8090
      - API_SERVER_PROTOCOL=http
      - API_SERVER_HOST=api_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}
      # --- HTTP -> HTTPS ---
      - traefik.http.routers.onyx-mcp.entrypoints=http
      - traefik.http.routers.onyx-mcp.rule=Host(`${ONYX_MCP_DOMAIN:-onyx-mcp.example.com}`)
      - traefik.http.routers.onyx-mcp.middlewares=onyx-mcp-https-redirect
      - traefik.http.middlewares.onyx-mcp-https-redirect.redirectscheme.scheme=https
      # --- HTTPS + TLS (kein Netz-Filter) ---
      # Auth macht der MCP-Server selbst: Bearer (Onyx-PAT/API-Key) gegen /me.
      - traefik.http.routers.onyx-mcp-secure.entrypoints=https
      - traefik.http.routers.onyx-mcp-secure.rule=Host(`${ONYX_MCP_DOMAIN:-onyx-mcp.example.com}`)
      - traefik.http.routers.onyx-mcp-secure.tls=true
      - traefik.http.routers.onyx-mcp-secure.tls.certresolver=http
      - traefik.http.services.onyx-mcp.loadbalancer.server.port=8090

networks:
  traefik-proxy:
    external: true
